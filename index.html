<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#084734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kontour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Kontour</title>
</head>
<body>

<!-- ── PIN gate ─────────────────────────────────────────────── -->
<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <div class="gate-mark">₹</div>
    <h1 class="gate-title">Kontour</h1>
    <p class="gate-sub" id="gate-sub">Enter your PIN</p>
    <div class="pin-dots" id="pin-dots">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="numpad" id="gate-pad"></div>
    <button class="bio-btn" id="gate-bio" hidden></button>
  </div>
</div>

<!-- ── App shell ────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <header id="topbar" class="topbar">
    <div class="topbar-in">
      <span class="topbar-t" data-tb-t></span>
      <span class="topbar-v num" data-tb-v></span>
    </div>
  </header>

  <main id="screen" class="screen" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-nav="dashboard" aria-label="Dashboard"></button>
    <button class="tab" data-nav="phynance"  aria-label="Phynance"></button>
    <button class="fab" id="fab" aria-label="New entry"></button>
    <button class="tab" data-nav="quotation" aria-label="Quotation"></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
