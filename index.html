<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#084734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kontour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Kontour</title>
</head>
<body>

<!-- ── PIN gate ─────────────────────────────────────────────── -->
<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <div class="gate-mark">₹</div>
    <h1 class="gate-title">Kontour</h1>
    <p class="gate-sub" id="gate-sub">Enter your PIN</p>
    <div class="pin-dots" id="pin-dots">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="numpad" id="gate-pad"></div>
    <button class="bio-btn" id="gate-bio" hidden></button>
  </div>
</div>

<!-- ── App shell ────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <!-- The line itself, as a column. Always there on a desktop; on a
       phone it slides in over the work and closes behind you. -->
  <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
  <div id="nav-scrim" class="nav-scrim"></div>

  <header id="brandbar" class="brandbar">
    <button class="brandbar-menu" data-nav-open aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <img src="assets/icon-192.png" alt="" class="brandbar-logo">
    <span class="brandbar-word">KONTOUR</span>
  </header>

  <header id="topbar" class="topbar">
    <div class="topbar-in">
      <span class="topbar-t" data-tb-t></span>
      <span class="topbar-v num" data-tb-v></span>
    </div>
  </header>

  <main id="screen" class="screen" aria-live="polite"></main>

  <!-- The entry button is an action, not a destination, so it never
       sits in the navigation column: it floats at the thumb's corner,
       wearing the live module's colour instead of the shell's. -->
  <button class="fab" id="fab" aria-label="New entry"></button>

  <!-- On a phone there is no room for a standing rail, so the two
       halves of the line — what is being made, and what it costs and
       earns — get one tap each at the thumb, instead of a drawer that
       has to be opened first. A desktop keeps the rail and never
       shows this. -->
  <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
